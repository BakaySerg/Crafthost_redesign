<!-- ///// MINI-INTRO (gradient) -->
<section class="section with-divider mini-intro">
	<div class="container">
		<i class="icon icon--gradient icon--lg">
			<svg viewBox="0 0 32 32"><use xlink:href="img/home/sprite.svg#lg-briefcase"/></svg>
		</i>
		<h1 class="h1 text-center"><span class="text-accent"></span></h1>
	</div>
</section>


<a href="#" class="btn btn--lg btn--filled">
	<span></span>
	<svg viewBox="0 0 32 32"><use xlink:href="img/general/sprite.svg#arrow-right"/></svg>
</a>

<!-- text-columns -->
<section class="section">
	<div class="container text-columns text-columns--uneven">
		<h2 class="h2"></h2>
		<p class="subtitle"></p>
	</div>
</section>

<!-- contextual -->
<section class="section">
	<div class="container contextual contextual--reversed">
		<div class="contextual__image">
			<img loading="lazy" srcset="img/about/.jpg, img/about/-2x.jpg 2x" src="img/about/.jpg" width="640" height="370" alt="img">
		</div>
		<div class="contextual__content">
		</div>
	</div>
</section>

<!-- FAQ -->
<section class="section">
	<div class="container md-line md-line--1_2">
		<h2 class="h2 pb-05">FAQ</h2>
		<div class="faq">
			<div class="faq__item" data-collapser="all">
				<div class="faq__question" data-collapse-trigger>
					<div class="faq__title"></div>
					<i class="faq__icon">
						<svg class="faq__icon-plus" viewBox="0 0 32 32"><use xlink:href="img/general/sprite.svg#plus"/></svg>
						<svg class="faq__icon-minus" viewBox="0 0 32 32"><use xlink:href="img/general/sprite.svg#minus"/></svg>
					</i>
				</div>
				<div class="faq__answer">
					<p></p>
				</div>
			</div>
		</div>
	</div>
</section>
