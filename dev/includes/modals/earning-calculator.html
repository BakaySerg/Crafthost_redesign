<dialog id="earnings-calculator" class="modal modal--md">
	<div class="modal__wrapper">

		<div class="container modal__container">
			<button class="btn modal__close" data-modal-close>
				<svg viewBox="0 0 32 32"><use xlink:href="img/general/sprite.svg#close"/></svg>
			</button>
			<h3 class="h3 text-center">Earnings Calculator.</h3>
			<p class="subtitle">Example Scenario (Mixed Referrals):</p>

			<div class="tiles tiles--uneven pb-2">
				<div class="tile icon--gradient">
					<svg viewBox="0 0 32 32">
						<use xlink:href="img/about/tech/sprite.svg#md-accelerate" />
					</svg>
					<div class="tile__name tile__name--bolder">
						<b class="text-gradient">5 VPS</b>
						<span class="tile__descr">Clients per month</span>
					</div>
				</div>
				<div class="tile icon--gradient">
					<svg viewBox="0 0 32 32">
						<use xlink:href="img/about/tech/sprite.svg#md-time" />
					</svg>
					<div class="tile__name tile__name--bolder">
						<b class="text-gradient">1 GPU</b>
						<span class="tile__descr">Referral</span>
					</div>
				</div>
				<div class="tile icon--gradient">
					<svg viewBox="0 0 32 32">
						<use xlink:href="img/about/tech/sprite.svg#md-cloud" />
					</svg>
					<div class="tile__name tile__name--bolder">
						<b class="text-gradient">1 enter&shy;prise</b>
						<span class="tile__descr">Deployment per quarter</span>
					</div>
				</div>
			</div>

			<div class="sticker mb-2">
				Estimated Yearly Earnings - <b>€4,000–€7,500 / $4,300–$8,100</b>
			</div>
			<a href="#" class="btn btn--filled btn--lg">
				<span>Apply Today</span>
				<svg viewBox="0 0 32 32">
					<use xlink:href="img/general/sprite.svg#arrow-right" />
				</svg>
			</a>
		</div>
	</div>
</dialog>
